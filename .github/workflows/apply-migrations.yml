name: Apply Supabase migrations

# Applies any new file in supabase/migrations/ to the production project when it
# lands on main, then verifies the schema really has it. Replaces the Supabase
# GitHub integration's "Deploy to production", which is not enabled on this plan
# (first attempt, pitch_drill_takes 2026-09-21, never applied).
#
# `supabase db push` applies only versions missing from
# supabase_migrations.schema_migrations; that table was baselined with the 24
# hand-applied migrations on 2026-09-21, so they are not re-run. A migration
# applied by hand must ALSO be inserted there, or this job will try to run it
# again and fail loudly (harmless, but red).
#
# Needs two repo secrets: SUPABASE_ACCESS_TOKEN (Dashboard → Account → Access
# Tokens) and SUPABASE_DB_PASSWORD (Project Settings → Database). The project
# ref is not a secret — it is in every Supabase URL.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

permissions:
  contents: read

# Never two pushes to the same database at once.
concurrency:
  group: apply-supabase-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: czambynrunaziywonqve

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what is pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify prod has every table and column
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SCRIPT_SUPABASE_EMAIL: ${{ secrets.SCRIPT_SUPABASE_EMAIL }}
          SCRIPT_SUPABASE_PASSWORD: ${{ secrets.SCRIPT_SUPABASE_PASSWORD }}
        run: npm run check:migrations-applied
