name: Import WaniKani kanji

# Manual-only, on purpose (see .github/workflows/backfill-vocabulary-suggestions.yml
# and docs/STATUS.md for the full rationale): writes to production Supabase
# using a real account password stored as a secret, so every run is an
# explicit, logged human action — never a push/schedule trigger. Needs a
# WaniKani API token (WANIKANI_API_TOKEN secret) to read the kanji catalog.
#
# Re-runnable and idempotent on `character` — a re-run refreshes readings,
# meanings, and (since 2026-08-30) the meaning/reading mnemonics + hints on
# every existing row. Raw WaniKani payloads are cached in the
# `wanikani_subjects` table, so a re-run only pulls what WaniKani changed
# (incremental `updated_after`), not the whole catalog.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run importer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SCRIPT_SUPABASE_EMAIL: ${{ secrets.SCRIPT_SUPABASE_EMAIL }}
          SCRIPT_SUPABASE_PASSWORD: ${{ secrets.SCRIPT_SUPABASE_PASSWORD }}
          WANIKANI_API_TOKEN: ${{ secrets.WANIKANI_API_TOKEN }}
        run: npm run import:wanikani-kanji
