name: Backfill verb-pair confusions

# Manual-only, on purpose (see .github/workflows/backfill-vocabulary-suggestions.yml
# and docs/STATUS.md for the full rationale): writes to production Supabase
# using a real account password stored as a secret, so every run is an
# explicit, logged human action — never a push/schedule trigger.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes (unchecked = dry run, prints what would change)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backfill
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SCRIPT_SUPABASE_EMAIL: ${{ secrets.SCRIPT_SUPABASE_EMAIL }}
          SCRIPT_SUPABASE_PASSWORD: ${{ secrets.SCRIPT_SUPABASE_PASSWORD }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            npm run backfill:verb-pair-confusions -- --apply
          else
            npm run backfill:verb-pair-confusions
          fi
