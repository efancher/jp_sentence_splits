name: Sync tests (real Postgres)

# Runs tests/pgIntegration against the project's real migrations + RLS. Separate
# from Deploy: it pulls ~1 GB of images, so relevant pushes/pull requests and
# manual dispatch run it independently of deployment.
on:
  push:
    branches: [main]
    paths:
      - 'src/sync/**'
      - 'src/db/repository.ts'
      - 'src/db/database.ts'
      - 'src/domain/**'
      - 'supabase/migrations/**'
      - 'tests/pgIntegration/**'
      - 'scripts/pg-test.sh'
      - '.github/workflows/sync-pg-tests.yml'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/sync/**'
      - 'src/db/repository.ts'
      - 'src/db/database.ts'
      - 'src/domain/**'
      - 'supabase/migrations/**'
      - 'tests/pgIntegration/**'
      - 'scripts/pg-test.sh'
      - '.github/workflows/sync-pg-tests.yml'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:pg
