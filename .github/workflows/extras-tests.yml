name: Browser and backend tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extras-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Mining backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/youtube-mining
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/youtube-mining/requirements.txt
            server/youtube-mining/requirements-dev.txt
      - name: Install audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test offline backend suite
        run: python -m pytest -m "not slow" -q

  browsers:
    name: App flows in Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browsers and system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Test browser suite
        env:
          # vite.config.ts otherwise selects the GitHub Pages subpath in Actions.
          # These tests build a local-only app served from /, without sync secrets.
          GITHUB_ACTIONS: 'false'
          CI: 'true'
        run: npx playwright test --project=chromium --project=webkit --workers=1
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
